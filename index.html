        /* ==========================================
           PALETTE — dark theme neutre, accent cyan
           ========================================== */
        :root {
            color-scheme: dark;
            --bg-1: #1a1a21;
            --bg-2: #0b0b0f;
            --bg-3: #141419;
            --text: #ececf1;
            --text-mid: rgba(236, 236, 241, 0.7);
            --text-dim: rgba(236, 236, 241, 0.45);
            --text-faint: rgba(236, 236, 241, 0.3);
            --surface: rgba(255, 255, 255, 0.035);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.18);
            --accent: #22d3ee;
            --accent-soft: rgba(34, 211, 238, 0.13);
            --accent-border: rgba(34, 211, 238, 0.45);
            --accent-glow: rgba(34, 211, 238, 0.16);
            --gold: #f1c40f;
            --panel: #101016;
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.06);
            --danger-border: rgba(248, 113, 113, 0.5);
            --warn: #fbbf24;
            --warn-border: rgba(251, 191, 36, 0.5);
        }

        html { scrollbar-color: #2c2c35 #0b0b0f; }
        ::selection { background: rgba(34, 211, 238, 0.25); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            letter-spacing: 2px;
        }

        #saveBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-mid);
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 1000;
            transition: color 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }
        #saveBtn:hover {
            color: #fff;
            background: var(--surface-hover);
            border-color: var(--border-strong);
        }

        .search-container { max-width: 600px; margin: 0 auto 20px auto; position: relative; }
        .search-input {
            width: 100%; padding: 15px 25px; border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--surface);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: var(--text); font-size: 1rem; outline: none; box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .search-input::placeholder { color: var(--text-dim); }
        .search-input:focus { border-color: var(--accent-border); box-shadow: 0 0 20px var(--accent-glow); }
        .search-shortcut {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.08); border: 1px solid var(--border-strong);
            border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; color: var(--text-faint);
            pointer-events: none; transition: opacity 0.2s ease;
        }
        .search-input:focus ~ .search-shortcut { opacity: 0; }

        .filter-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .filter-btn {
            padding: 8px 16px; border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-mid); cursor: pointer;
            font-size: 0.85rem; transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease; font-family: inherit;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-soft);
            border-color: var(--accent-border); color: #fff;
        }

        /* ==========================================
           CHECKER DE LIENS — barre d'état + badges
           ========================================== */
        .link-check-bar { max-width: 1200px; margin: 0 auto 40px; text-align: center; font-size: 0.8rem; min-height: 26px; }
        .lc-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-dim);
            border-radius: 14px; padding: 3px 12px; font-size: 0.75rem; cursor: pointer;
            font-family: inherit; transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }
        .lc-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface); }
        .lc-status { color: var(--text-dim); }
        .lc-ok { color: rgba(52, 211, 153, 0.9); }
        .lc-warn { color: var(--warn); font-weight: 500; }
        .lc-list {
            list-style: none; margin: 12px auto 0; padding: 10px 14px; max-width: 560px;
            text-align: left; background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; max-height: 240px; overflow-y: auto;
        }
        .lc-list li { display: flex; gap: 8px; padding: 4px 2px; font-size: 0.78rem; align-items: baseline; }
        .lc-emoji { flex-shrink: 0; }
        .lc-name { color: var(--text); font-weight: 500; }
        .lc-meta { color: var(--text-dim); font-size: 0.7rem; margin-left: auto; text-align: right; }
        .lc-trust {
            background: transparent; border: 1px solid var(--border); color: var(--text-faint);
            border-radius: 10px; padding: 1px 8px; font-size: 0.68rem; cursor: pointer;
            font-family: inherit; flex-shrink: 0; transition: color 0.3s ease, border-color 0.3s ease;
        }
        .lc-trust:hover { color: rgba(52, 211, 153, 0.9); border-color: rgba(52, 211, 153, 0.5); }
        .lc-hint { max-width: 560px; margin: 8px auto 0; font-size: 0.7rem; color: var(--text-faint); }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }

        .featured-container { max-width: 600px; margin: 0 auto 30px auto; opacity: 1; transform: translateY(0); transition: opacity 0.25s ease, transform 0.25s ease; }
        .featured-card {
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            padding: 25px; border-radius: 20px;
            color: var(--text); display: flex; align-items: center; gap: 20px;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 25px var(--accent-glow);
            position: relative;
        }
        .featured-card:hover { background: rgba(34, 211, 238, 0.2); transform: translateY(-5px); box-shadow: 0 0 40px rgba(34, 211, 238, 0.35); }
        .featured-link { display: flex; align-items: center; gap: 20px; text-decoration: none; color: var(--text); flex: 1; min-width: 0; }
        .featured-icon { width: 50px; height: 50px; border-radius: 12px; flex-shrink: 0; }
        .featured-text { text-align: left; min-width: 0; }
        .featured-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 5px; }
        .featured-desc { font-size: 0.9rem; color: rgba(236, 236, 241, 0.75); }

        .featured-flex-container { max-width: 1200px; margin: 0 auto 60px auto; display: flex; gap: 20px; flex-wrap: wrap; opacity: 1; transform: translateY(0); transition: opacity 0.25s ease, transform 0.25s ease; }
        .featured-flex-container .featured-card { flex: 1; min-width: 280px; }

        .category {
            margin-bottom: 50px; max-width: 1200px; margin-left: auto; margin-right: auto;
            opacity: 1; transform: translateY(0); transition: opacity 0.25s ease, transform 0.25s ease;
            content-visibility: auto; contain-intrinsic-size: auto 600px;
        }
        .category h2 { font-size: 1.1rem; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; padding-left: 10px; border-left: 4px solid var(--accent); display: flex; align-items: baseline; gap: 10px; }
        .tool-count { font-size: 0.75rem; color: rgba(34, 211, 238, 0.55); font-weight: 400; letter-spacing: 0; text-transform: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        .tool-card-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 15px; border-radius: 16px;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            position: relative;
            display: flex; align-items: center; justify-content: space-between; gap: 5px;
        }
        .tool-card-wrapper:hover { background: var(--surface-hover); transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); border-color: var(--border-strong); }

        .tool-card {
            display: flex; align-items: center; gap: 15px;
            text-decoration: none; color: var(--text);
            flex-grow: 1; min-width: 0;
        }

        .tool-icon { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; background: rgba(255, 255, 255, 0.08); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); flex-shrink: 0; }

        .tool-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .tool-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tool-desc { font-size: 0.75rem; color: var(--text-dim); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Badges des repos GitHub (étoiles + langage) */
        .repo-badges { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; }
        .repo-badges .rb {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.65rem; color: var(--text-dim);
            padding: 1px 8px; border-radius: 999px;
            background: var(--surface); border: 1px solid var(--border);
        }
        .repo-badges .rb-stars { color: var(--gold); }
        .repo-badges .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

        .fav-btn {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-faint); font-size: 1.2rem;
            padding: 5px; transition: color 0.3s ease, transform 0.3s ease; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .fav-btn:hover { color: var(--gold); transform: scale(1.2); }
        .fav-btn.active { color: var(--gold); }

        .tooltip {
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(5px);
            background: var(--panel); color: #fff; padding: 6px 12px; border-radius: 8px;
            font-size: 0.8rem; max-width: 220px; width: max-content; text-align: center;
            pointer-events: none; opacity: 0; visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid rgba(255, 255, 255, 0.12);
            word-wrap: break-word;
        }
        .tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border: 6px solid transparent; border-top-color: var(--panel);
        }
        .tool-card-wrapper:hover .tooltip,
        .tool-card-wrapper:focus-within .tooltip {
            opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        }

        /* États "lien mort / muet" posés après les règles normales pour garder la priorité au hover */
        .tool-card-wrapper.link-dead, .featured-card.link-dead { border-color: var(--danger-border); background: var(--danger-bg); }
        .tool-card-wrapper.link-slow, .featured-card.link-slow { border-color: var(--warn-border); }
        .tool-card-wrapper.link-dead::after, .featured-card.link-dead::after,
        .tool-card-wrapper.link-slow::after, .featured-card.link-slow::after {
            content: '';
            position: absolute; top: -7px; right: -7px;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .tool-card-wrapper.link-dead::after, .featured-card.link-dead::after { content: '✕'; background: #ef4444; color: #fff; }
        .tool-card-wrapper.link-slow::after, .featured-card.link-slow::after { content: '⏱'; background: var(--warn); color: #1a1a21; font-size: 9px; font-weight: 400; }

        .no-results {
            text-align: center; padding: 80px 20px;
            opacity: 0; transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .no-results-emoji { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }
        .no-results-text { font-size: 1.1rem; color: var(--text-dim); }
        .no-results-term { color: rgba(34, 211, 238, 0.85); font-weight: 500; }

        #backToTop {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%;
            background: var(--accent-soft); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--accent-border); color: white; font-size: 1.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, background 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000;
        }
        #backToTop.show { opacity: 1; visibility: visible; }
        #backToTop:hover { background: rgba(34, 211, 238, 0.28); transform: translateY(-3px); }

        /* Accessibilité clavier */
        .tool-card:focus-visible, .featured-link:focus-visible, .filter-btn:focus-visible,
        .fav-btn:focus-visible, #saveBtn:focus-visible, #backToTop:focus-visible, .lc-btn:focus-visible {
            outline: 2px solid rgba(34, 211, 238, 0.65);
            outline-offset: 2px;
        }

        /* Respect des préférences système */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Petits écrans : Save masqué (peu utile sur mobile), plus besoin de dégager le haut */
        @media (max-width: 600px) {
            body { padding: 40px 15px 40px; }
            h1 { font-size: 2rem; letter-spacing: 1px; }
            #saveBtn { display: none; }
            #backToTop { bottom: 20px; right: 20px; width: 44px; height: 44px; }
            .lc-list { max-height: 200px; }
        }
    </style>
</head>

        let favorites = [];
        try {
            favorites = JSON.parse(localStorage.getItem('toolboxFavorites')) || [];
        } catch (e) {
            favorites = [];
        }

        const isFavorite = url => favorites.includes(url);

        function toggleFavorite(url) {
            const index = favorites.indexOf(url);
            const nowFav = index === -1;
            if (nowFav) favorites.push(url);
            else favorites.splice(index, 1);

            try {
                localStorage.setItem('toolboxFavorites', JSON.stringify(favorites));
            } catch (e) {}

            // Met à jour tous les boutons correspondant à cette URL
            document.querySelectorAll('.fav-btn').forEach(btn => {
                if (btn.dataset.url !== url) return;
                btn.classList.toggle('active', nowFav);
                btn.setAttribute('aria-pressed', String(nowFav));
                btn.setAttribute('aria-label', nowFav ? 'Retirer des favoris' : 'Ajouter aux favoris');
            });
        }

        // ==========================================
        // RENDU (généré une seule fois)
        // ==========================================
        const esc = s => String(s).replace(/[&<>"']/g, c => (
            { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
        ));

        // Recherche insensible à la casse ET aux accents
        const normalize = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        // ~150 icônes d'outils (affichées en 32px) : DuckDuckGo, sans traçage Google
        const faviconURL = domain => `https://icons.duckduckgo.com/ip3/${encodeURIComponent(domain)}.ico`;
        // Les 3 cartes featured (affichées en 50px) : Google en 64px pour rester nettes
        const faviconURLHQ = domain => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;

        function getDomain(url) {
            try { return new URL(url).hostname; } catch (e) { return url; }
        }

        function favBtnHTML(url) {
            const fav = isFavorite(url);
            return `<button class="fav-btn ${fav ? 'active' : ''}" data-url="${esc(url)}" aria-pressed="${fav}" aria-label="${fav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">⭐</button>`;
        }

        function featuredCardHTML(t) {
            const search = normalize([t.name, t.desc, t.fullDesc, ...t.categories].join(' '));
            return `
                <div class="featured-card" data-url="${esc(t.url)}" data-categories="${esc(t.categories.join(','))}" data-search="${esc(search)}">
                    <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" class="featured-link">
                        <img src="${faviconURLHQ(t.imgDomain)}" alt="${esc(t.alt)}" class="featured-icon" loading="lazy" decoding="async">
                        <div class="featured-text">
                            <div class="featured-title">${esc(t.name)}</div>
                            <div class="featured-desc">${esc(t.desc)}</div>
                        </div>
                    </a>
                    ${favBtnHTML(t.url)}
                </div>`;
        }

        function repoAvatar(url) {

        }

        const GH_LANG_COLORS = {
            JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', Go: '#00ADD8',
            Rust: '#dea584', C: '#555555', 'C++': '#f34b7d', Java: '#b07219', 'C#': '#178600',
            Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c', PHP: '#4F5D95', Ruby: '#701516',
            Vue: '#41b883', Svelte: '#ff3e00', Clojure: '#db5855', Dart: '#00B4AB', Zig: '#ec915c',
            Lua: '#000080', Haskell: '#5e5086', MDX: '#fcb32c', 'Jupyter Notebook': '#DA5B0B',
            Makefile: '#427819', Nix: '#7e7eff', Markdown: '#083fa1'
        };

        function formatStars(n) {
            if (typeof n !== 'number' || isNaN(n)) return '';
            if (n < 1000) return String(n);
            if (n < 10000) return (n / 1000).toFixed(1).replace('.', ',') + 'k';
            return Math.round(n / 1000) + 'k';
        }

        function repoBadgesHTML(t) {
            if (!t.stars && !t.lang) return '';
            const stars = t.stars ? `<span class="rb rb-stars">★ ${formatStars(t.stars)}</span>` : '';
            const lang = t.lang ? `<span class="rb rb-lang"><span class="dot" style="background:${GH_LANG_COLORS[t.lang] || '#8b8b8b'}"></span>${esc(t.lang)}</span>` : '';
            return `<span class="repo-badges" data-repo-url="${esc(t.url)}">${stars}${lang}</span>`;
        }

        function toolCardHTML(t, cat) {
            const search = normalize(`${t.name} ${t.shortDesc} ${t.fullDesc} ${cat.category} ${t.lang || ''}`);
            return `
                <div class="tool-card-wrapper" data-url="${esc(t.url)}" data-search="${esc(search)}">
                    <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" class="tool-card">
                        <img src="${repoAvatar(t.url) || faviconURL(getDomain(t.url))}" alt="${esc(t.name)}" class="tool-icon" loading="lazy" decoding="async">
                        <div class="tool-info">
                            <span class="tool-name">${esc(t.name)}</span>
                            <span class="tool-desc">${esc(t.shortDesc)}</span>
                            ${repoBadgesHTML(t)}
                        </div>
                    </a>
                    ${favBtnHTML(t.url)}
                    <div class="tooltip">${esc(t.fullDesc)}</div>
                </div>`;
        }

        function renderFilters() {
            const filters = [
                { filter: 'all', text: 'Tous', icon: '✨' },
                { filter: 'Favoris', text: 'Favoris', icon: '⭐' },
                ...toolsData.map(c => ({ filter: c.category, text: c.filterText, icon: c.icon }))
            ];
            document.getElementById('filter-container').innerHTML = filters.map(f => `
                <button class="filter-btn" data-filter="${esc(f.filter)}" aria-pressed="false">${f.icon} ${esc(f.text)}</button>
            `).join('');
        }

        function renderCards() {
            document.getElementById('featured-container').innerHTML = featuredData.map(featuredCardHTML).join('');
            document.getElementById('featured-flex-container').innerHTML = featuredFlexData.map(featuredCardHTML).join('');
            document.getElementById('categories-container').innerHTML = toolsData.map(cat => `
                <div class="category" data-category="${esc(cat.category)}">
                    <h2>${cat.icon} ${esc(cat.title)} <span class="tool-count">${cat.tools.length}</span></h2>
                    <div class="grid">${cat.tools.map(t => toolCardHTML(t, cat)).join('')}</div>
                </div>
            `).join('');
        }

        // ==========================================
        // LOGIQUE D'AFFICHAGE (source unique de vérité : state)
        // ==========================================
        const searchInput = document.getElementById('search');
        const backToTop = document.getElementById('backToTop');
        const noResults = document.getElementById('noResults');
        const noResultsEmoji = document.getElementById('noResultsEmoji');
        const noResultsText = document.getElementById('noResultsText');
        const featuredBox = document.getElementById('featured-container');
        const featuredFlexBox = document.getElementById('featured-flex-container');

        const FADE_MS = 250; // aligné sur les transitions CSS (0.25s)
        const fadeTimers = new Map();

        function fadeOut(el) {
            if (fadeTimers.has(el)) clearTimeout(fadeTimers.get(el));
            el.style.opacity = '0';
            el.style.transform = 'translateY(8px)';
            fadeTimers.set(el, setTimeout(() => { el.style.display = 'none'; }, FADE_MS));
        }

        function fadeIn(el) {
            if (fadeTimers.has(el)) {
                clearTimeout(fadeTimers.get(el));
                fadeTimers.delete(el);
            }
            el.style.display = '';
            void el.offsetWidth; // force le reflow pour relancer la transition
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
        }

        function syncFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const isActive = btn.dataset.filter === state.filter;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', String(isActive));
            });
        }

        function syncURL() {
            const target = state.filter === 'all'
                ? location.pathname + location.search
                : '#' + encodeURIComponent(state.filter);
            try {
                history.replaceState(null, '', target);
            } catch (e) {
                // Contexte file:// qui bloque replaceState : on passe par le hash
                if (state.filter !== 'all') location.hash = encodeURIComponent(state.filter);
            }
        }

        // Une seule règle de visibilité pour toutes les cartes
        function cardMatches(card) {
            if (state.term) return state.term.split(/\s+/).every(w => card.dataset.search.includes(w));
            if (state.filter === 'all') return true;
            if (state.filter === 'Favoris') return isFavorite(card.dataset.url);
            return card.dataset.categories
                ? card.dataset.categories.split(',').includes(state.filter)
                : card.closest('.category').dataset.category === state.filter;
        }

        function update() {
            syncFilterButtons();

            // Cartes d'outils
            let visibleTools = 0;
            document.querySelectorAll('.tool-card-wrapper').forEach(card => {
                const show = cardMatches(card);
                card.style.display = show ? 'flex' : 'none';
                if (show) visibleTools++;
            });

            // Catégories vides -> masquées
            document.querySelectorAll('.category').forEach(cat => {
                const hasVisible = [...cat.querySelectorAll('.tool-card-wrapper')].some(c => c.style.display !== 'none');
                hasVisible ? fadeIn(cat) : fadeOut(cat);
            });

            // Cartes "featured"
            let singleVisible = false, anyFlexVisible = false;
            document.querySelectorAll('.featured-card').forEach(card => {
                const show = cardMatches(card);
                card.style.display = show ? 'flex' : 'none';
                if (!show) return;
                card.closest('#featured-flex-container') ? anyFlexVisible = true : singleVisible = true;
            });
            singleVisible ? fadeIn(featuredBox) : fadeOut(featuredBox);
            anyFlexVisible ? fadeIn(featuredFlexBox) : fadeOut(featuredFlexBox);

            // Message d'état vide
            const anyFeaturedVisible = singleVisible || anyFlexVisible;
            if (state.term && visibleTools === 0 && !anyFeaturedVisible) {
                noResultsEmoji.textContent = '🔍';
                noResultsText.innerHTML = `Aucun outil trouvé pour « <span class="no-results-term">${esc(searchInput.value)}</span> »`;
                fadeIn(noResults);
            } else if (!state.term && state.filter === 'Favoris' && visibleTools === 0 && !anyFeaturedVisible) {
                noResultsEmoji.textContent = '⭐';
                noResultsText.textContent = "Aucun favori pour l'instant — clique sur l'étoile d'un outil pour le retrouver ici.";
                fadeIn(noResults);
            } else {
                fadeOut(noResults);
            }

            syncURL();
        }

        // Démarrage : restaure le filtre indiqué dans l'URL (#musique, #favoris…)
        // try/catch : un hash malformé (#%…) ne doit jamais faire planter la page
        let initialFilter = '';
        try {
            initialFilter = decodeURIComponent(location.hash.slice(1));
        } catch (e) {
            initialFilter = '';
        }
        if (initialFilter === 'Favoris' || toolsData.some(c => c.category === initialFilter)) {
            state.filter = initialFilter;
        }
        renderFilters();
        renderCards();
        update();

        // ==========================================
        // CHECKER DE LIENS MORTS
        // (no-cors : détecte les domaines injoignables et les muets ;
        //  ne peut pas lire les codes HTTP — limite assumée du 100% navigateur)
        // ==========================================
        const CHECK_STORAGE_KEY = 'toolboxLinkCheck.v2';
        const WHITELIST_KEY = 'toolboxLinkWhitelist';
        const CHECK_TTL_MS = 7 * 24 * 60 * 60 * 1000;   // re-vérif auto au-delà de 7 jours
        const CHECK_TIMEOUT_MS = 10000;                  // délai avant "sans réponse" (les sites lents existent)
        const CHECK_RETRY_MS = 1500;                     // pause entre les 2 tentatives d'un domaine
        const FAST_FAIL_MS = 3000;                       // rejet < 3 s = domaine vraiment refusé
        const CHECK_CONCURRENCY = 4;                     // requêtes parallèles max
        const PROBE_ORIGINS = ['https://www.gstatic.com', 'https://www.cloudflare.com'];
        const ADBAIT_URL = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';

        let checking = false;
        let lastCheck = null;        // { ts, results: { [origin]: 'ok' | 'dead' | 'slow' } }
        let listOpen = true;         // liste des suspects dépliée par défaut
        let adblockSuspected = false;

        // Whitelist "✓ ça marche" : domaines exclus des signalements
        // (un bloqueur de pubs ou un DNS filtrant peut faire échouer la
        //  vérification d'un site qui fonctionne parfaitement)
        let linkWhitelist = [];
        try { linkWhitelist = JSON.parse(localStorage.getItem(WHITELIST_KEY)) || []; } catch (e) {}
        const isWhitelisted = origin => linkWhitelist.includes(origin);
        function saveWhitelist() {
            try { localStorage.setItem(WHITELIST_KEY, JSON.stringify(linkWhitelist)); } catch (e) {}
        }

        const lcBarLive = document.getElementById('link-check-live');
        const lcBarMain = document.getElementById('link-check-main');

        function originOf(url) {
            try { return new URL(url).origin; } catch (e) { return url; }
        }

        function allToolURLs() {
            return [
                ...featuredData.map(t => t.url),
                ...featuredFlexData.map(t => t.url),
                ...toolsData.flatMap(c => c.tools.map(t => t.url))
            ];
        }

        function timeAgo(ts) {
            const min = Math.floor((Date.now() - ts) / 60000);
            if (min < 1) return "à l'instant";
            if (min < 60) return `il y a ${min} min`;
            const h = Math.floor(min / 60);
            if (h < 24) return `il y a ${h} h`;
            return `il y a ${Math.floor(h / 24)} j`;
        }

        function readCheckCache() {
            try {
                const c = JSON.parse(localStorage.getItem(CHECK_STORAGE_KEY));
                if (c && c.ts && c.results) return c;
            } catch (e) {}
            return null;
        }

        // Teste une origine : 'ok' (répond), 'dead' (2 rejets rapides consécutifs
        // = DNS mort / connexion refusée), 'slow' (timeout ou rejet lent — trop
        // incertain pour crier au loup). Les liens en http:// sont d'abord
        // tentés en https (contenu mixte), puis en http.
        function checkLink(origin) {
            // Une tentative : 'ok' | 'slow' | 'refused'
            const attempt = url => new Promise(resolve => {
                const ctrl = new AbortController();
                const t0 = performance.now();
                const timer = setTimeout(() => ctrl.abort(), CHECK_TIMEOUT_MS);
                fetch(url, { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: ctrl.signal })
                    .then(() => { clearTimeout(timer); resolve('ok'); })
                    .catch(err => {
                        clearTimeout(timer);
                        if (err.name === 'AbortError') return resolve('slow');
                        // Rejet quasi instantané = domaine refusé ; rejet lent = réseau capricieux
                        resolve(performance.now() - t0 < FAST_FAIL_MS ? 'refused' : 'slow');
                    });
            });
            // Deux tentatives espacées : seul le double rejet rapide mérite 'dead'
            const run = async url => {
                const r1 = await attempt(url);
                if (r1 === 'ok') return 'ok';
                await new Promise(r => setTimeout(r, CHECK_RETRY_MS));
                const r2 = await attempt(url);
                if (r2 === 'ok') return 'ok';
                return (r1 === 'refused' && r2 === 'refused') ? 'dead' : 'slow';
            };
            if (origin.startsWith('http://')) {
                return run(origin.replace('http://', 'https://'))
                    .then(r => r === 'ok' ? r : run(origin));
            }
            return run(origin);
        }

        // File d'exécution à concurrence limitée
        async function runPool(items, worker, concurrency) {
            const queue = [...items];
            const runners = Array.from({ length: Math.min(concurrency, queue.length) }, async () => {
                while (queue.length) {
                    const item = queue.shift();
                    await worker(item);
                }
            });
            await Promise.all(runners);
        }

        // Applique les statuts aux cartes (badges + info dans le tooltip)
        function applyStatusesToCards(results) {
            document.querySelectorAll('.tool-card-wrapper, .featured-card').forEach(card => {
                const origin = originOf(card.dataset.url);
                const status = isWhitelisted(origin) ? undefined : results[origin];
                card.classList.toggle('link-dead', status === 'dead');
                card.classList.toggle('link-slow', status === 'slow');
                const tip = card.querySelector('.tooltip');
                if (tip) {
                    if (!tip.dataset.base) tip.dataset.base = tip.textContent;
                    tip.textContent = (status === 'dead' || status === 'slow')
                        ? `${status === 'dead' ? '⛔ Injoignable' : '⏱ Sans réponse'} à la dernière vérification — ${tip.dataset.base}`
                        : tip.dataset.base;
                }
            });
        }

        function buildSuspectRows(results) {
            const rows = [];
            const add = (t, cat) => {
                const origin = originOf(t.url);
                if (isWhitelisted(origin)) return;
                const st = results[origin];
                if (st === 'dead' || st === 'slow') rows.push({ st, name: t.name, domain: getDomain(t.url), cat, origin });
            };
            featuredData.forEach(t => add(t, 'Featured'));
            featuredFlexData.forEach(t => add(t, 'Featured'));
            toolsData.forEach(c => c.tools.forEach(t => add(t, c.category)));
            rows.sort((a, b) => (a.st === b.st ? a.name.localeCompare(b.name) : (a.st === 'dead' ? -1 : 1)));
            return rows;
        }

        function setLive(text) {
            lcBarLive.textContent = text;
        }

        function setBar(mode, total) {
            if (mode === 'idle') {
                lcBarMain.innerHTML = `<button class="lc-btn" data-action="rerun">🩺 Vérifier les liens</button>`;
            } else if (mode === 'checking') {
                lcBarMain.innerHTML = `<span class="lc-status">🔄 Vérification des liens en cours… <span class="lc-count" aria-hidden="true">0/${total ?? '…'}</span></span>`;
            } else if (mode === 'impossible') {
                lcBarMain.innerHTML = `<span class="lc-warn">⚠️ Vérification impossible — réseau bloqué ou hors ligne</span> <button class="lc-btn" data-action="rerun">Réessayer</button>`;
            } else if (mode === 'done' && lastCheck) {
                const rows = buildSuspectRows(lastCheck.results);
                const dead = rows.filter(r => r.st === 'dead').length;
                const slow = rows.length - dead;
                const checked = Object.keys(lastCheck.results).length;
                const when = timeAgo(lastCheck.ts);
                if (dead === 0 && slow === 0) {
                    lcBarMain.innerHTML = `<span class="lc-ok">✅ ${checked} liens répondent · ${when}</span> <button class="lc-btn" data-action="rerun">Re-vérifier</button>`;
                } else {
                    let html = `<span class="lc-warn">⛔ ${dead} injoignable${dead > 1 ? 's' : ''}${slow ? ` · ⏱ ${slow} sans réponse` : ''} · ${when}</span> <button class="lc-btn" data-action="rerun">Re-vérifier</button> <button class="lc-btn" data-action="toggle">${listOpen ? 'Masquer' : 'Voir'}</button>`;
                    if (listOpen) {
                        html += `<ul class="lc-list">` + rows.map(r =>
                            `<li><span class="lc-emoji">${r.st === 'dead' ? '⛔' : '⏱'}</span><span class="lc-name">${esc(r.name)}</span><span class="lc-meta">${esc(r.domain)}${r.cat ? ' · ' + esc(r.cat) : ''}</span><button class="lc-trust" data-action="trust" data-origin="${esc(r.origin)}" title="Le site marche chez moi — ne plus jamais le signaler">✓ ça marche</button></li>`
                        ).join('') + `</ul>`;
                        const hint = adblockSuspected
                            ? "Bloqueur de pubs détecté : certains ⛔ peuvent être des faux positifs. « ✓ ça marche » exclut un lien définitivement."
                            : "Signalé à tort ? Un bloqueur (uBlock, Brave…) ou un DNS filtrant peut empêcher la vérification d'un site qui fonctionne. « ✓ ça marche » l'exclut définitivement.";
                        html += `<div class="lc-hint">${hint}</div>`;
                    }
                    lcBarMain.innerHTML = html;
                }
            }
        }

        function updateProgress(done, total) {
            const el = document.querySelector('.lc-count');
            if (el) el.textContent = `${done}/${total}`;
        }

        async function runLinkCheck() {
            if (checking) return;
            checking = true;

            const origins = [...new Set(allToolURLs().map(originOf))].filter(o => !isWhitelisted(o));
            setBar('checking', origins.length);
            setLive('Vérification des liens en cours.');

            // Sonde réseau : si même les sites étalons ne répondent pas,
            // on ne marque rien (évite les faux positifs massifs)
            const probes = await Promise.all(PROBE_ORIGINS.map(o => checkLink(o)));
            if (!probes.includes('ok')) {
                checking = false;
                setBar(lastCheck ? 'done' : 'impossible');
                if (!lastCheck) setLive('Vérification des liens impossible.');
                return;
            }

            // Sonde bloqueur de pubs : l'appât publicitaire est rejeté alors
            // que le réseau marche → un bloqueur filtre les requêtes du navigateur
            // et peut transformer des sites sains en faux ⛔
            adblockSuspected = await new Promise(resolve => {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 4000);
                fetch(ADBAIT_URL, { mode: 'no-cors', signal: ctrl.signal })
                    .then(() => { clearTimeout(timer); resolve(false); })
                    .catch(() => { clearTimeout(timer); resolve(true); });
            });

            const results = {};
            let done = 0;
            applyStatusesToCards(results); // reset des badges existants

            await runPool(origins, async (origin) => {
                results[origin] = await checkLink(origin);
                done++;
                updateProgress(done, origins.length);
                applyStatusesToCards(results); // badges progressifs
            }, CHECK_CONCURRENCY);

            lastCheck = { ts: Date.now(), results };
            try {
                localStorage.setItem(CHECK_STORAGE_KEY, JSON.stringify(lastCheck));
            } catch (e) {}

            checking = false;
            applyStatusesToCards(results);
            setBar('done');
            const suspects = buildSuspectRows(results).length;
            setLive(suspects === 0
                ? 'Vérification terminée : tous les liens répondent.'
                : `Vérification terminée : ${suspects} liens suspects.`);
        }

        // Interactions de la barre (délégation)
        document.getElementById('link-check-bar').addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            if (btn.dataset.action === 'rerun') runLinkCheck();
            else if (btn.dataset.action === 'toggle') {
                listOpen = !listOpen;
                setBar('done');
            } else if (btn.dataset.action === 'trust') {
                const origin = btn.dataset.origin;
                if (origin && !isWhitelisted(origin)) {
                    linkWhitelist.push(origin);
                    saveWhitelist();
                    if (lastCheck) applyStatusesToCards(lastCheck.results);
                }
                setBar('done');
                setLive('Domaine marqué comme fonctionnel — il ne sera plus signalé.');
            }
        });

        // Initialisation du checker : cache affiché immédiatement,
        // re-vérif auto en arrière-plan si les résultats ont plus de 7 jours
        lastCheck = readCheckCache();
        if (lastCheck) applyStatusesToCards(lastCheck.results);
        setBar(lastCheck ? 'done' : 'idle');
        if (!lastCheck || Date.now() - lastCheck.ts > CHECK_TTL_MS) {
            // En arrière-plan, Chrome bride les requêtes (faux timeouts en série) :
            // on attend que l'onglet soit visible pour lancer la vérification.
            const start = () => setTimeout(() => runLinkCheck(), 1500);
            if (document.visibilityState === 'visible') start();
            else document.addEventListener('visibilitychange', function onVisible() {
                if (document.visibilityState !== 'visible') return;
                document.removeEventListener('visibilitychange', onVisible);
                start();
            });
        }

        // ==========================================
        // STARS GITHUB EN DIRECT (API publique, sans clé)
        // CORS ouvert → fonctionne même en file://. Quota : 60 req/h sans
        // clé ; cache 24 h en localStorage ; repli sur les valeurs en dur.
        // ==========================================
        const GH_STARS_KEY = 'toolboxRepoStars';

        function ghRepoKey(url) {
            const m = String(url).match(/^https:\/\/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/?$/);
            return m ? m[1].toLowerCase() : null;
        }

        function updateRepoBadges() {
            document.querySelectorAll('.repo-badges[data-repo-url]').forEach(b => {
                const key = ghRepoKey(b.dataset.repoUrl);
                if (!key) return;
                const tool = toolsData.flatMap(c => c.tools).find(t => ghRepoKey(t.url) === key && t.stars !== undefined);
                if (!tool) return;
                const el = b.querySelector('.rb-stars');
                if (el) el.textContent = `★ ${formatStars(tool.stars)}`;
            });
        }

        async function refreshRepoStars() {
            if (!navigator.onLine) return;
            let cache = {};
            try { cache = JSON.parse(localStorage.getItem(GH_STARS_KEY)) || {}; } catch (e) {}

            const setStars = (key, stars) => toolsData.forEach(cat => cat.tools.forEach(t => {
                if (ghRepoKey(t.url) === key) t.stars = stars;
            }));

            // 1. Pré-remplissage depuis le cache (aucune requête réseau)
            let dirty = false;
            Object.keys(cache).forEach(key => {
                if (typeof cache[key].stars === 'number') { setStars(key, cache[key].stars); dirty = true; }
            });
            if (dirty) updateRepoBadges();

            // 2. Rafraîchit les repos périmés (max 15 par session, ~6 s au total)
            const now = Date.now();
            const repos = [...new Set(toolsData.flatMap(c => c.tools).map(t => ghRepoKey(t.url)).filter(Boolean))];
            const stale = repos.filter(k => !cache[k] || now - cache[k].at > 24 * 3600 * 1000).slice(0, 15);
            for (const key of stale) {
                try {
                    const res = await fetch(`https://api.github.com/repos/${key}`, { headers: { Accept: 'application/vnd.github+json' } });
                    if (res.status === 403 || res.status === 429) break;   // quota atteint : on s'arrête là
                    if (res.ok) {
                        const d = await res.json();
                        cache[key] = { at: now, stars: d.stargazers_count };
                        setStars(key, d.stargazers_count);
                        updateRepoBadges();
                        try { localStorage.setItem(GH_STARS_KEY, JSON.stringify(cache)); } catch (e) {}
                    }
                } catch (e) { /* hors ligne ou bloqué : on garde les valeurs en dur */ }
                await new Promise(r => setTimeout(r, 400));
            }
        }
        setTimeout(refreshRepoStars, 2000);

        // ==========================================
        // ÉVÉNEMENTS (délégation unique)
        // ==========================================
        document.addEventListener('click', e => {
            const favBtn = e.target.closest('.fav-btn');
            if (favBtn) {
                e.preventDefault();
                toggleFavorite(favBtn.dataset.url);
                if (state.filter === 'Favoris') update();
                return;
            }

            const filterBtn = e.target.closest('.filter-btn');
            if (filterBtn) {
                searchInput.value = '';
                state.term = '';
                state.filter = filterBtn.dataset.filter;
                update();
            }
        });

        searchInput.addEventListener('input', () => {
            state.term = normalize(searchInput.value).trim();
            state.filter = 'all';
            update();
        });

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                state.term = '';
                state.filter = 'all';
                update();
                searchInput.blur();
            }
        });

        // Raccourci "/" pour focus la recherche
        document.addEventListener('keydown', e => {
            if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const el = document.activeElement;
                if (el !== searchInput && el?.tagName !== 'INPUT' && el?.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            }
        });

        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.scrollY > 300);
        }, { passive: true });

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => searchInput.focus(), 500);
        });

        // Favicon de secours : délégation en phase de capture
        // (l'événement "error" ne bulle pas, mais il se capture)
        document.addEventListener('error', e => {
            const img = e.target;
            if (img.tagName === 'IMG' && !img.dataset.errored) {
                img.dataset.errored = '1';
                img.src = fallbackIcon;
            }
        }, true);

        // Sauvegarde : récupère la source originale si possible (http/https),
        // sinon retombe sur le DOM courant (utile en file://)
        document.getElementById('saveBtn').addEventListener('click', async () => {
            let html;
            try {
                const res = await fetch(location.href);
                if (!res.ok) throw new Error('fetch échoué');
                html = await res.text();
            } catch (e) {
                html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            }
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'toolbox-backup.html';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

    </script>

</body>
</html>
