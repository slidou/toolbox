            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        #saveBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 1000;
            transition: color 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }
        #saveBtn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .search-container { max-width: 600px; margin: 0 auto 20px auto; position: relative; }
        .search-input {
            width: 100%; padding: 15px 25px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: #ffffff; font-size: 1rem; outline: none; box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .search-input:focus { border-color: rgba(168, 161, 246, 0.5); box-shadow: 0 0 20px rgba(168, 161, 246, 0.2); }
        .search-shortcut {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; color: rgba(255,255,255,0.3);
            pointer-events: none; transition: opacity 0.2s ease;
        }
        .search-input:focus ~ .search-shortcut { opacity: 0; }

        .filter-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .filter-btn {
            padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255,255,255,0.7); cursor: pointer;
            font-size: 0.85rem; transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease; font-family: inherit;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(168, 161, 246, 0.2);
            border-color: rgba(168, 161, 246, 0.5); color: #fff;
        }

        .featured-container { max-width: 600px; margin: 0 auto 30px auto; opacity: 1; transform: translateY(0); transition: opacity 0.25s ease, transform 0.25s ease; }
        .featured-card {
            background: rgba(168, 161, 246, 0.1);
            border: 1px solid rgba(168, 161, 246, 0.4);
            padding: 25px; border-radius: 20px;
            color: #ffffff; display: flex; align-items: center; gap: 20px;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 25px rgba(168, 161, 246, 0.2);
        }
        .featured-card:hover { background: rgba(168, 161, 246, 0.2); transform: translateY(-5px); box-shadow: 0 0 40px rgba(168, 161, 246, 0.5); }
        .featured-link { display: flex; align-items: center; gap: 20px; text-decoration: none; color: #ffffff; flex: 1; min-width: 0; }
        .featured-icon { width: 50px; height: 50px; border-radius: 12px; flex-shrink: 0; }
        .featured-text { text-align: left; min-width: 0; }
        .featured-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 5px; }
        .featured-desc { font-size: 0.9rem; color: #d0cdf7; }

        .featured-flex-container { max-width: 1200px; margin: 0 auto 60px auto; display: flex; gap: 20px; flex-wrap: wrap; opacity: 1; transform: translateY(0); transition: opacity 0.25s ease, transform 0.25s ease; }
        .featured-flex-container .featured-card { flex: 1; min-width: 280px; }

        .category { margin-bottom: 50px; max-width: 1200px; margin-left: auto; margin-right: auto; opacity: 1; transform: translateY(0); transition: opacity 0.25s ease, transform 0.25s ease; }
        .category h2 { font-size: 1.1rem; color: #a8a1f6; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; padding-left: 10px; border-left: 4px solid #a8a1f6; display: flex; align-items: baseline; gap: 10px; }
        .tool-count { font-size: 0.75rem; color: rgba(168, 161, 246, 0.5); font-weight: 400; letter-spacing: 0; text-transform: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        .tool-card-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px; border-radius: 16px;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex; align-items: center; justify-content: space-between; gap: 5px;
        }
        .tool-card-wrapper:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.3); }

        .tool-card {
            display: flex; align-items: center; gap: 15px;
            text-decoration: none; color: #ffffff;
            flex-grow: 1; min-width: 0;
        }

        .tool-icon { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; background: rgba(255, 255, 255, 0.1); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); flex-shrink: 0; }

        .tool-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .tool-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tool-desc { font-size: 0.75rem; color: rgba(255,255,255,0.4); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .fav-btn {
            background: transparent; border: none; cursor: pointer;
            color: rgba(255,255,255,0.3); font-size: 1.2rem;
            padding: 5px; transition: color 0.3s ease, transform 0.3s ease; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .fav-btn:hover { color: #f1c40f; transform: scale(1.2); }
        .fav-btn.active { color: #f1c40f; }

        .tooltip {
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(5px);
            background: #1a1a2e; color: #fff; padding: 6px 12px; border-radius: 8px;
            font-size: 0.8rem; max-width: 220px; width: max-content; text-align: center;
            pointer-events: none; opacity: 0; visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid rgba(168, 161, 246, 0.3);
            word-wrap: break-word;
        }
        .tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border: 6px solid transparent; border-top-color: #1a1a2e;
        }
        .tool-card-wrapper:hover .tooltip,
        .tool-card-wrapper:focus-within .tooltip {
            opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        }

        .no-results {
            text-align: center; padding: 80px 20px;
            opacity: 0; transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .no-results-emoji { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }
        .no-results-text { font-size: 1.1rem; color: rgba(255,255,255,0.4); }
        .no-results-term { color: rgba(168, 161, 246, 0.8); font-weight: 500; }

            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(168, 161, 246, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 161, 246, 0.4); color: white; font-size: 1.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, background 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000;
        }
        #backToTop.show { opacity: 1; visibility: visible; }
        #backToTop:hover { background: rgba(168, 161, 246, 0.4); transform: translateY(-3px); }

        /* Accessibilité clavier */
        .tool-card:focus-visible, .featured-link:focus-visible, .filter-btn:focus-visible,
        .fav-btn:focus-visible, #saveBtn:focus-visible, #backToTop:focus-visible {
            outline: 2px solid rgba(168, 161, 246, 0.8);
            outline-offset: 2px;
        }

        /* Respect des préférences système */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Petits écrans : évite le chevauchement h1 / bouton Save */
        @media (max-width: 600px) {
            body { padding: 80px 15px 40px; }
            h1 { font-size: 2rem; letter-spacing: 1px; }
            #backToTop { bottom: 20px; right: 20px; width: 44px; height: 44px; }
        }
    </style>

        // ==========================================
        // ÉTAT & FAVORIS
        // ==========================================
        const state = { filter: 'all', term: '' };

        let favorites = [];
        try {
            favorites = JSON.parse(localStorage.getItem('toolboxFavorites')) || [];
        } catch (e) {
            favorites = [];
        }

        const isFavorite = url => favorites.includes(url);

        function toggleFavorite(url) {
            const index = favorites.indexOf(url);
            const nowFav = index === -1;
            if (nowFav) favorites.push(url);
            else favorites.splice(index, 1);

            try {
                localStorage.setItem('toolboxFavorites', JSON.stringify(favorites));
            } catch (e) {}

            // Met à jour tous les boutons correspondant à cette URL
            document.querySelectorAll('.fav-btn').forEach(btn => {
                if (btn.dataset.url !== url) return;
                btn.classList.toggle('active', nowFav);
                btn.setAttribute('aria-pressed', String(nowFav));
                btn.setAttribute('aria-label', nowFav ? 'Retirer des favoris' : 'Ajouter aux favoris');
            });
        }

        // ==========================================
        // RENDU (généré une seule fois)
        // ==========================================
        const esc = s => String(s).replace(/[&<>"']/g, c => (
            { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
        ));

        // Recherche insensible à la casse ET aux accents
        const normalize = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        // ~150 icônes d'outils (affichées en 32px) : DuckDuckGo, sans traçage Google
const faviconURL = domain => `https://icons.duckduckgo.com/ip3/${encodeURIComponent(domain)}.ico`;
// Les 3 cartes featured (affichées en 50px) : Google en 64px pour rester nettes
const faviconURLHQ = domain => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;

        function getDomain(url) {
            try { return new URL(url).hostname; } catch (e) { return url; }
        }

        function favBtnHTML(url) {
            const fav = isFavorite(url);
            return `<button class="fav-btn ${fav ? 'active' : ''}" data-url="${esc(url)}" aria-pressed="${fav}" aria-label="${fav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">⭐</button>`;
        }

        function featuredCardHTML(t) {
            const search = normalize([t.name, t.desc, t.fullDesc, ...t.categories].join(' '));
            return `
                <div class="featured-card" data-url="${esc(t.url)}" data-categories="${esc(t.categories.join(','))}" data-search="${esc(search)}">
                    <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" class="featured-link">
                        <img src="${faviconURLHQ(t.imgDomain)}" alt="${esc(t.alt)}" class="featured-icon" loading="lazy" decoding="async">
                        <div class="featured-text">
                            <div class="featured-title">${esc(t.name)}</div>
                            <div class="featured-desc">${esc(t.desc)}</div>
                        </div>
                    </a>
                    ${favBtnHTML(t.url)}
                </div>`;
        }

        function toolCardHTML(t, cat) {
            const search = normalize(`${t.name} ${t.shortDesc} ${t.fullDesc} ${cat.category}`);
            return `
                <div class="tool-card-wrapper" data-url="${esc(t.url)}" data-search="${esc(search)}">
                    <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" class="tool-card">
                        <img src="${faviconURL(getDomain(t.url))}" alt="${esc(t.name)}" class="tool-icon" loading="lazy" decoding="async">
                        <div class="tool-info">
                            <span class="tool-name">${esc(t.name)}</span>
                            <span class="tool-desc">${esc(t.shortDesc)}</span>
                        </div>
                    </a>
                    ${favBtnHTML(t.url)}
                    <div class="tooltip">${esc(t.fullDesc)}</div>
                </div>`;
        }

        function renderFilters() {
            const filters = [
                { filter: 'all', text: 'Tous', icon: '✨' },
                { filter: 'Favoris', text: 'Favoris', icon: '⭐' },
                ...toolsData.map(c => ({ filter: c.category, text: c.filterText, icon: c.icon }))
            ];
            document.getElementById('filter-container').innerHTML = filters.map(f => `
                <button class="filter-btn" data-filter="${esc(f.filter)}" aria-pressed="false">${f.icon} ${esc(f.text)}</button>
            `).join('');
        }

        function renderCards() {
            document.getElementById('featured-container').innerHTML = featuredData.map(featuredCardHTML).join('');
            document.getElementById('featured-flex-container').innerHTML = featuredFlexData.map(featuredCardHTML).join('');
            document.getElementById('categories-container').innerHTML = toolsData.map(cat => `
                <div class="category" data-category="${esc(cat.category)}">
                    <h2>${cat.icon} ${esc(cat.title)} <span class="tool-count">${cat.tools.length}</span></h2>
                    <div class="grid">${cat.tools.map(t => toolCardHTML(t, cat)).join('')}</div>
                </div>
            `).join('');
        }

        // ==========================================
        // LOGIQUE D'AFFICHAGE (source unique de vérité : state)
        // ==========================================
        const searchInput = document.getElementById('search');
        const backToTop = document.getElementById('backToTop');
        const noResults = document.getElementById('noResults');
        const noResultsEmoji = document.getElementById('noResultsEmoji');
        const noResultsText = document.getElementById('noResultsText');
        const featuredBox = document.getElementById('featured-container');
        const featuredFlexBox = document.getElementById('featured-flex-container');

        const FADE_MS = 250; // aligné sur les transitions CSS (0.25s)
        const fadeTimers = new Map();

        function fadeOut(el) {
            if (fadeTimers.has(el)) clearTimeout(fadeTimers.get(el));
            el.style.opacity = '0';
            el.style.transform = 'translateY(8px)';
            fadeTimers.set(el, setTimeout(() => { el.style.display = 'none'; }, FADE_MS));
        }

        function fadeIn(el) {
            if (fadeTimers.has(el)) {
                clearTimeout(fadeTimers.get(el));
                fadeTimers.delete(el);
            }
            el.style.display = '';
            void el.offsetWidth; // force le reflow pour relancer la transition
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
        }

        function syncFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const isActive = btn.dataset.filter === state.filter;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', String(isActive));
            });
        }

        function syncURL() {
            const target = state.filter === 'all'
                ? location.pathname + location.search
                : '#' + encodeURIComponent(state.filter);
            try {
                history.replaceState(null, '', target);
            } catch (e) {
                // Contexte file:// qui bloque replaceState : on passe par le hash
                if (state.filter !== 'all') location.hash = encodeURIComponent(state.filter);
            }
        }

        // Une seule règle de visibilité pour toutes les cartes
        function cardMatches(card) {
            if (state.term) return state.term.split(/\s+/).every(w => card.dataset.search.includes(w));
            if (state.filter === 'all') return true;
            if (state.filter === 'Favoris') return isFavorite(card.dataset.url);
            return card.dataset.categories
                ? card.dataset.categories.split(',').includes(state.filter)
                : card.closest('.category').dataset.category === state.filter;
        }

        function update() {
            syncFilterButtons();

            // Cartes d'outils
            let visibleTools = 0;
            document.querySelectorAll('.tool-card-wrapper').forEach(card => {
                const show = cardMatches(card);
                card.style.display = show ? 'flex' : 'none';
                if (show) visibleTools++;
            });

            // Catégories vides -> masquées
            document.querySelectorAll('.category').forEach(cat => {
                const hasVisible = [...cat.querySelectorAll('.tool-card-wrapper')].some(c => c.style.display !== 'none');
                hasVisible ? fadeIn(cat) : fadeOut(cat);
            });

            // Cartes "featured"
            let singleVisible = false, anyFlexVisible = false;
            document.querySelectorAll('.featured-card').forEach(card => {
                const show = cardMatches(card);
                card.style.display = show ? 'flex' : 'none';
                if (!show) return;
                card.closest('#featured-flex-container') ? anyFlexVisible = true : singleVisible = true;
            });
            singleVisible ? fadeIn(featuredBox) : fadeOut(featuredBox);
            anyFlexVisible ? fadeIn(featuredFlexBox) : fadeOut(featuredFlexBox);

            // Message d'état vide
            const anyFeaturedVisible = singleVisible || anyFlexVisible;
            if (state.term && visibleTools === 0 && !anyFeaturedVisible) {
                noResultsEmoji.textContent = '🔍';
                noResultsText.innerHTML = `Aucun outil trouvé pour « <span class="no-results-term">${esc(searchInput.value)}</span> »`;
                fadeIn(noResults);
            } else if (!state.term && state.filter === 'Favoris' && visibleTools === 0 && !anyFeaturedVisible) {
                noResultsEmoji.textContent = '⭐';
                noResultsText.textContent = "Aucun favori pour l'instant — clique sur l'étoile d'un outil pour le retrouver ici.";
                fadeIn(noResults);
            } else {
                fadeOut(noResults);
            }

            syncURL();
        }

        // Démarrage : restaure le filtre indiqué dans l'URL (#musique, #favoris…)
        
        const initialFilter = decodeURIComponent(location.hash.slice(1));
        if (initialFilter === 'Favoris' || toolsData.some(c => c.category === initialFilter)) {
        state.filter = initialFilter;
        }
        renderFilters();
        renderCards();
        update();
        
        // ==========================================
        // ÉVÉNEMENTS (délégation unique)
        // ==========================================
        document.addEventListener('click', e => {
            const favBtn = e.target.closest('.fav-btn');
            if (favBtn) {
                e.preventDefault();
                toggleFavorite(favBtn.dataset.url);
                if (state.filter === 'Favoris') update();
                return;
            }

            const filterBtn = e.target.closest('.filter-btn');
            if (filterBtn) {
                searchInput.value = '';
                state.term = '';
                state.filter = filterBtn.dataset.filter;
                update();
            }
        });

        searchInput.addEventListener('input', () => {
            state.term = normalize(searchInput.value).trim();
            state.filter = 'all';
            update();
        });

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                state.term = '';
                state.filter = 'all';
                update();
                searchInput.blur();
            }
        });

        // Raccourci "/" pour focus la recherche
        document.addEventListener('keydown', e => {
            if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const el = document.activeElement;
                if (el !== searchInput && el?.tagName !== 'INPUT' && el?.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            }
        });

        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.scrollY > 300);
        }, { passive: true });

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => searchInput.focus(), 500);
        });

        // Favicon de secours : délégation en phase de capture
        // (l'événement "error" ne bulle pas, mais il se capture)
        document.addEventListener('error', e => {
            const img = e.target;
            if (img.tagName === 'IMG' && !img.dataset.errored) {
                img.dataset.errored = '1';
                img.src = fallbackIcon;
            }
        }, true);

        // Sauvegarde : récupère la source originale si possible (http/https),
        // sinon retombe sur le DOM courant (utile en file://)
        document.getElementById('saveBtn').addEventListener('click', async () => {
            let html;
            try {
                const res = await fetch(location.href);
                if (!res.ok) throw new Error('fetch échoué');
                html = await res.text();
            } catch (e) {
                html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            }
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'toolbox-backup.html';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });
    </script>

</body>
</html>
