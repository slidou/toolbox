            border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; color: rgba(255,255,255,0.3);

        .search-input:focus ~ .search-shortcut { opacity: 0; }

        .filter-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 40px; }

        .fav-btn.active { color: #f1c40f; }

        .tooltip {
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(5px);
            background: #1a1a2e; color: #fff; padding: 6px 12px; border-radius: 8px;
            font-size: 0.8rem; max-width: 220px; width: max-content; text-align: center;
            pointer-events: none; opacity: 0; visibility: hidden; transition: all 0.2s ease; z-index: 100;

        }
        .tooltip::after {

        }
        .tool-card-wrapper:hover .tooltip {

        // ==========================================
        // SYSTÈME DE FAVORIS (Sécurisé)
        // ==========================================
        let favorites = [];
        try {
            favorites = JSON.parse(localStorage.getItem('toolboxFavorites')) || [];
        } catch (e) {
            favorites = [];
        }

        function toggleFavorite(url, btn) {
            const index = favorites.indexOf(url);
            if (index > -1) {
                favorites.splice(index, 1);
                btn.classList.remove('active');
                btn.setAttribute('aria-pressed', 'false');
                btn.setAttribute('aria-label', 'Ajouter aux favoris');
            } else {
                favorites.push(url);
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                btn.setAttribute('aria-label', 'Retirer des favoris');
            }
            try {
                localStorage.setItem('toolboxFavorites', JSON.stringify(favorites));
            } catch (e) {}
        }

        function isFavorite(url) {
            return favorites.includes(url);
        }

        // ==========================================
        // RENDU DYNAMIQUE (DATA-DRIVEN)
        // ==========================================
        function getDomain(url) {
            try { 
                return new URL(url).hostname; 
            } catch (e) { 
                return url; 
            }
        }

        function renderFilters() {
            const filters = [
                { filter: "all", text: "Tous", icon: "✨" },
                { filter: "Favoris", text: "Favoris", icon: "⭐" },
                ...toolsData.map(c => ({ filter: c.category, text: c.filterText, icon: c.icon }))
            ];
            const container = document.getElementById('filter-container');
            container.innerHTML = filters.map((f, i) => `
                <button class="filter-btn ${i === 0 ? 'active' : ''}" data-filter="${f.filter}" aria-pressed="${i === 0 ? 'true' : 'false'}">${f.icon} ${f.text}</button>
            `).join('');
        }

        function renderCards() {
            // Featured container
            const featContainer = document.getElementById('featured-container');
            featContainer.innerHTML = featuredData.map(t => `
                <a href="${t.url}" target="_blank" rel="noopener noreferrer" class="featured-card" data-desc="${t.fullDesc}">
                    <img src="https://www.google.com/s2/favicons?domain=${t.imgDomain}&sz=64" alt="${t.alt}" class="featured-icon" onerror="handleImgError(this)">
                    <div class="featured-text">
                        <div class="featured-title">${t.name}</div>
                        <div class="featured-desc">${t.desc}</div>
                    </div>
                </a>
            `).join('');

            // Featured flex container
            const featFlexContainer = document.getElementById('featured-flex-container');
            featFlexContainer.innerHTML = featuredFlexData.map(t => `
                <a href="${t.url}" target="_blank" rel="noopener noreferrer" class="featured-card" data-desc="${t.fullDesc}">
                    <img src="https://www.google.com/s2/favicons?domain=${t.imgDomain}&sz=64" alt="${t.alt}" class="featured-icon" onerror="handleImgError(this)">
                    <div class="featured-text">
                        <div class="featured-title">${t.name}</div>
                        <div class="featured-desc">${t.desc}</div>
                    </div>
                </a>
            `).join('');

            // Categories
            const catContainer = document.getElementById('categories-container');
            catContainer.innerHTML = toolsData.map(cat => `
                <div class="category" data-category="${cat.category}">
                    <h2>${cat.icon} ${cat.title} <span class="tool-count"></span></h2>
                    <div class="grid">
                        ${cat.tools.map(t => `
                            <div class="tool-card-wrapper" data-desc="${t.fullDesc}">
                                <a href="${t.url}" target="_blank" rel="noopener noreferrer" class="tool-card">
                                    <img src="https://www.google.com/s2/favicons?domain=${getDomain(t.url)}&sz=64" alt="${t.name}" class="tool-icon" onerror="handleImgError(this)">
                                    <div class="tool-info">
                                        <span class="tool-name">${t.name}</span>
                                        <span class="tool-desc">${t.shortDesc}</span>
                                    </div>
                                </a>
                                <button class="fav-btn ${isFavorite(t.url) ? 'active' : ''}" data-url="${t.url}" aria-pressed="${isFavorite(t.url) ? 'true' : 'false'}" aria-label="${isFavorite(t.url) ? 'Retirer des favoris' : 'Ajouter aux favoris'}">⭐</button>
                                <div class="tooltip">${t.fullDesc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Update counts
            document.querySelectorAll('.category').forEach(cat => {
                const count = cat.querySelectorAll('.tool-card-wrapper').length;
                cat.querySelector('.tool-count').textContent = count;
            });
        }

        // ==========================================
        // INITIALISATION & LOGIQUE UI
        // ==========================================
        const searchInput = document.getElementById('search');
        const backToTop = document.getElementById('backToTop');
        const noResults = document.getElementById('noResults');
        const noResultsTerm = document.getElementById('noResultsTerm');
        const fadeTimers = new Map();

        function fadeOut(el) {
            if (fadeTimers.has(el)) clearTimeout(fadeTimers.get(el));
            el.style.opacity = '0';
            el.style.transform = 'translateY(8px)';
            fadeTimers.set(el, setTimeout(() => { el.style.display = 'none'; }, 220));
        }

        function fadeIn(el) {
            if (fadeTimers.has(el)) {
                clearTimeout(fadeTimers.get(el));
                fadeTimers.delete(el);
            }
            el.style.display = '';
            void el.offsetWidth;
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
        }

        // Démarrage
        renderFilters();
        renderCards();

        const featuredBox = document.getElementById('featured-container');
        const featuredFlexBox = document.getElementById('featured-flex-container');

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('fav-btn')) {
                e.preventDefault();
                e.stopPropagation();
                toggleFavorite(e.target.dataset.url, e.target);
                
                const activeFilter = document.querySelector('.filter-btn.active');
                if (activeFilter && activeFilter.dataset.filter === 'Favoris') {
                    applyFilter('Favoris');
                }
            }
            
            if (e.target.classList.contains('filter-btn')) {
                searchInput.value = '';
                document.querySelectorAll('.filter-btn').forEach(b => { 
                    b.classList.remove('active'); 
                    b.setAttribute('aria-pressed', 'false'); 
                });
                e.target.classList.add('active'); 
                e.target.setAttribute('aria-pressed', 'true');
                
                applyFilter(e.target.dataset.filter);
            }
        });

        function applyFilter(filter) {
            const categories = document.querySelectorAll('.category');
            
            categories.forEach(cat => {
                let hasVisible = false;
                cat.querySelectorAll('.tool-card-wrapper').forEach(c => {
                    let match = false;
                    if (filter === 'all') match = true;
                    else if (filter === 'Favoris') match = c.querySelector('.fav-btn').classList.contains('active');
                    else match = cat.dataset.category === filter;

                    if (match) {
                        c.style.display = 'flex';
                        hasVisible = true;
                    } else {
                        c.style.display = 'none';
                    }
                });
                hasVisible ? fadeIn(cat) : fadeOut(cat);
            });

            if (filter === 'all' || filter === 'Streaming' || filter === 'Favoris') {
                fadeIn(featuredBox);
                fadeIn(featuredFlexBox);
            } else {
                fadeOut(featuredBox);
                fadeOut(featuredFlexBox);
            }

            fadeOut(noResults);
        }

        searchInput.addEventListener('input', function() {
            const term = searchInput.value.toLowerCase().trim();
            document.querySelectorAll('.filter-btn').forEach(btn => { 
                btn.classList.remove('active'); 
                btn.setAttribute('aria-pressed', 'false'); 
            });
            const allBtn = document.querySelector('[data-filter="all"]');
            allBtn.classList.add('active'); 
            allBtn.setAttribute('aria-pressed', 'true');

            if (term === '') {
                fadeIn(featuredBox);
                fadeIn(featuredFlexBox);
            } else {
                const fmhyCard = featuredBox.querySelector('.featured-card');
                if (fmhyCard) {
                    const fmhyMatch = fmhyCard.textContent.toLowerCase().includes(term) || fmhyCard.dataset.desc.toLowerCase().includes(term);
                    fmhyMatch ? fadeIn(featuredBox) : fadeOut(featuredBox);
                }

                let showAnimeBox = false;
                featuredFlexBox.querySelectorAll('.featured-card').forEach(card => {
                    if (card.textContent.toLowerCase().includes(term) || card.dataset.desc.toLowerCase().includes(term)) showAnimeBox = true;
                });
                showAnimeBox ? fadeIn(featuredFlexBox) : fadeOut(featuredFlexBox);
            }

            let visibleCount = 0;
            document.querySelectorAll('.tool-card-wrapper').forEach(card => {
                const match = card.textContent.toLowerCase().includes(term) || card.dataset.desc.toLowerCase().includes(term);
                card.style.display = match ? 'flex' : 'none';
                if (match) visibleCount++;
            });

            document.querySelectorAll('.category').forEach(cat => {
                let hasVisible = false;
                cat.querySelectorAll('.tool-card-wrapper').forEach(c => {
                    if (c.style.display !== 'none') hasVisible = true;
                });
                hasVisible ? fadeIn(cat) : fadeOut(cat);
            });

            noResultsTerm.textContent = searchInput.value;
            if (term !== '' && visibleCount === 0) {
                fadeIn(noResults);
            } else {
                fadeOut(noResults);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchInput.blur();
                searchInput.dispatchEvent(new Event('input'));
            }
        });

        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.scrollY > 300);
        });

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
            setTimeout(() => searchInput.focus(), 500);
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'toolbox-backup.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        });
    </script>
